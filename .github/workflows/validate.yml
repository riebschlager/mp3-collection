name: Validate

on:
  pull_request:
  push:
    branches: [ main, master ]
    paths:
      - 'apps/**'
      - 'tools/**'
      - 'data/**'
      - 'Makefile'
      - '.github/workflows/validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      LASTFM_API_KEY: ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Validate
        run: make validate
